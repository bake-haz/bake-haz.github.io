name: Deploy Workplace Problems V1

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/deploy-workplace-problems-v1.yml'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download validated artifact
        run: |
          curl -fL 'https://sdmntpreastus.oaiusercontent.com/files/00000000-f710-81f9-9ec1-91b2c363c1d2/raw?se=2026-09-07T11%3A22%3A32Z&sp=r&sv=2026-02-06&sr=b&scid=1837d527-93b6-5bb4-857f-2ecb11c745d7&skoid=bb372dd6-3b2a-4af2-b355-c26497ba23cd&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-07T01%3A12%3A07Z&ske=2026-09-08T01%3A12%3A07Z&sks=b&skv=2026-02-06&sig=ttsx3vHxFQUwq0ZwT9waPEWSshAxeW%2BIiYmG4RPjIf4%3D' -o /tmp/wp.zip
          rm -rf /tmp/wp-public
          mkdir -p /tmp/wp-public
          unzip -q /tmp/wp.zip -d /tmp/wp-public
          test -f /tmp/wp-public/index.html
          test -f /tmp/wp-public/sitemap.xml
      - name: Replace Workplace Problems deployment
        run: |
          rm -rf workplace-problems
          mkdir -p workplace-problems
          cp -a /tmp/wp-public/. workplace-problems/
          test "$(find workplace-problems -name index.html | wc -l)" -eq 23
      - name: Commit deployment
        run: |
          git config user.name "bake-haz"
          git config user.email "bakehaz@gmail.com"
          git add workplace-problems
          git diff --cached --quiet && exit 0
          git commit -m "Deploy Workplace Problems V1 from validated artifact"
          git push origin HEAD:main
